spring:
  application:
    name: beltwise-api

  datasource:
    url: jdbc:postgresql://localhost:5433/acidentes_db
    username: postgres
    password: postgres

  jpa:
    show-sql: true
    properties:
      hibernate:
        ddl-auto: validate
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  error:
    include-message: always

  jackson:
    deserialization:
      fail-on-unknown-properties: true